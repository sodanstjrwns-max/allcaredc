<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>올케어치과 로고 시안 40종 — 넘버링 선택</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#062741; --gold:#b08d57; --ivory:#fffeee; --ivory2:#f1e9dc;
    --ink:#1a2733; --muted:#5b6b78; --line:rgba(6,39,65,.12);
    --card:#ffffff; --page:#f4f1ea;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{
    font-family:'Pretendard',-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Segoe UI',sans-serif;
    background:var(--page); color:var(--ink); line-height:1.55;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:1200px;margin:0 auto;padding:0 20px}

  /* ── header ── */
  header{
    background:linear-gradient(160deg,#062741 0%,#0a3a5c 100%);
    color:var(--ivory); padding:44px 0 38px; text-align:center;
  }
  header .eyebrow{
    font-family:'Fraunces',serif; letter-spacing:.28em; text-transform:uppercase;
    font-size:12px; color:var(--gold); margin-bottom:14px;
  }
  header h1{font-size:clamp(24px,4vw,36px);font-weight:700;letter-spacing:-.02em}
  header p{color:rgba(255,254,238,.72);margin-top:12px;font-size:15px}
  .brandline{margin-top:18px;font-size:13px;color:rgba(255,254,238,.55)}

  /* ── toolbar (sticky) ── */
  .toolbar{
    position:sticky; top:0; z-index:50;
    background:rgba(244,241,234,.9); backdrop-filter:blur(10px);
    border-bottom:1px solid var(--line);
    padding:12px 0;
  }
  .toolbar .wrap{display:flex;gap:12px;align-items:center;flex-wrap:wrap;justify-content:space-between}
  .tb-group{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .tb-label{font-size:12px;color:var(--muted);font-weight:600}
  .btn{
    border:1px solid var(--line); background:#fff; color:var(--ink);
    padding:8px 14px; border-radius:999px; font-size:13px; font-weight:600;
    cursor:pointer; transition:.15s; white-space:nowrap;
  }
  .btn:hover{border-color:var(--gold);color:var(--gold)}
  .btn.active{background:var(--navy);color:var(--ivory);border-color:var(--navy)}
  .pick-count{font-size:13px;color:var(--muted)}
  .pick-count b{color:var(--gold);font-size:15px}

  /* ── grid ── */
  main{padding:32px 0 80px}
  .grid{
    display:grid; grid-template-columns:repeat(4,1fr); gap:18px;
  }
  @media(max-width:900px){.grid{grid-template-columns:repeat(3,1fr)}}
  @media(max-width:640px){.grid{grid-template-columns:repeat(2,1fr);gap:12px}}

  .card{
    background:var(--card); border:1px solid var(--line); border-radius:16px;
    overflow:hidden; position:relative; transition:.18s;
    box-shadow:0 1px 2px rgba(6,39,65,.04);
  }
  .card:hover{transform:translateY(-3px);box-shadow:0 14px 30px rgba(6,39,65,.13);border-color:rgba(176,141,87,.5)}
  .card.picked{border-color:var(--gold);box-shadow:0 0 0 2px var(--gold)}

  .num{
    position:absolute; top:10px; left:10px; z-index:3;
    background:var(--navy); color:var(--ivory);
    font-family:'Fraunces',serif; font-weight:600;
    min-width:30px; height:30px; padding:0 8px;
    border-radius:8px; display:flex;align-items:center;justify-content:center;
    font-size:14px; letter-spacing:.02em;
  }
  .card.picked .num{background:var(--gold)}

  .fav{
    position:absolute; top:10px; right:10px; z-index:3;
    width:32px;height:32px;border-radius:50%;
    background:rgba(255,255,255,.9); border:1px solid var(--line);
    display:flex;align-items:center;justify-content:center;
    cursor:pointer; font-size:16px; line-height:1; transition:.15s;
    color:#c8ccd0;
  }
  .fav:hover{transform:scale(1.12)}
  .card.picked .fav{color:#e0245e;background:#fff;border-color:#e0245e}

  .thumb{
    aspect-ratio:1/1; width:100%;
    display:flex;align-items:center;justify-content:center;
    background:var(--ivory);
    transition:background .2s;
  }
  .thumb img{width:100%;height:100%;object-fit:contain;display:block}

  .card .cap{
    padding:10px 12px 12px; border-top:1px solid var(--line);
    display:flex;align-items:center;justify-content:space-between;gap:8px;
  }
  .cap .no{font-family:'Fraunces',serif;font-weight:600;color:var(--navy);font-size:14px}
  .cap .zoom{font-size:12px;color:var(--muted);text-decoration:none}
  .cap .zoom:hover{color:var(--gold)}

  /* dark backdrop mode */
  body.bg-navy .thumb{background:var(--navy)}
  body.bg-ivory .thumb{background:var(--ivory)}
  body.bg-white .thumb{background:#fff}

  /* ── selected summary bar ── */
  .summary{
    position:fixed; left:0; right:0; bottom:0; z-index:60;
    background:var(--navy); color:var(--ivory);
    transform:translateY(110%); transition:.25s;
    box-shadow:0 -8px 30px rgba(0,0,0,.25);
  }
  .summary.show{transform:translateY(0)}
  .summary .wrap{display:flex;align-items:center;gap:16px;padding:14px 20px;flex-wrap:wrap}
  .summary .lbl{font-size:13px;color:rgba(255,254,238,.7)}
  .summary .nums{font-family:'Fraunces',serif;font-size:18px;color:var(--gold);font-weight:600;flex:1;min-width:160px}
  .summary .copybtn{background:var(--gold);color:var(--navy);border:none}
  .summary .copybtn:hover{filter:brightness(1.08);color:var(--navy)}
  .summary .clearbtn{background:transparent;border:1px solid rgba(255,254,238,.4);color:var(--ivory)}

  /* ── lightbox ── */
  .lb{
    position:fixed;inset:0;z-index:100;background:rgba(6,20,33,.92);
    display:none;align-items:center;justify-content:center;padding:24px;
  }
  .lb.show{display:flex}
  .lb img{max-width:min(90vw,640px);max-height:80vh;border-radius:16px;box-shadow:0 20px 60px rgba(0,0,0,.5)}
  .lb .lbnum{position:absolute;top:24px;left:50%;transform:translateX(-50%);color:var(--gold);font-family:'Fraunces',serif;font-size:22px}
  .lb .close{position:absolute;top:20px;right:26px;color:#fff;font-size:34px;cursor:pointer;line-height:1}
  .lb .nav{position:absolute;top:50%;transform:translateY(-50%);color:#fff;font-size:40px;cursor:pointer;user-select:none;padding:20px;opacity:.7}
  .lb .nav:hover{opacity:1}
  .lb .prev{left:8px}.lb .next{right:8px}

  footer{background:var(--navy);color:rgba(255,254,238,.6);text-align:center;padding:30px 20px 40px;font-size:13px}
  footer b{color:var(--gold)}
</style>
</head>
<body class="bg-ivory">

<header>
  <div class="wrap">
    <div class="eyebrow">ALLCARE Dental · Logo Proposal</div>
    <h1>올케어치과 로고 시안 40종</h1>
    <p>AC (All Care) 모노그램 — 네이비 &amp; 골드 · "치과계 어벤저스" 톤</p>
    <div class="brandline">번호를 눌러 마음에 드는 시안을 담아 두세요. 하단에 선택 번호가 정리됩니다.</div>
  </div>
</header>

<div class="toolbar">
  <div class="wrap">
    <div class="tb-group">
      <span class="tb-label">배경</span>
      <button class="btn" data-bg="bg-ivory">아이보리</button>
      <button class="btn" data-bg="bg-white">화이트</button>
      <button class="btn" data-bg="bg-navy">네이비</button>
    </div>
    <div class="tb-group">
      <span class="pick-count">선택 <b id="count">0</b> / 40</span>
      <button class="btn" id="showFav">담은 것만 보기</button>
    </div>
  </div>
</div>

<main>
  <div class="wrap">
    <div class="grid" id="grid"><!-- cards injected --></div>
  </div>
</main>

<!-- selected summary -->
<div class="summary" id="summary">
  <div class="wrap">
    <span class="lbl">담은 시안</span>
    <span class="nums" id="summaryNums">—</span>
    <button class="btn copybtn" id="copyBtn">번호 복사</button>
    <button class="btn clearbtn" id="clearBtn">전체 해제</button>
  </div>
</div>

<!-- lightbox -->
<div class="lb" id="lb">
  <span class="close" id="lbClose">&times;</span>
  <span class="nav prev" id="lbPrev">&#10094;</span>
  <div class="lbnum" id="lbNum"></div>
  <img id="lbImg" src="" alt="">
  <span class="nav next" id="lbNext">&#10095;</span>
</div>

<footer>
  <b>올케어치과의원</b> · 로고 시안 선택용 페이지 &nbsp;|&nbsp; 내부 검토용 (검색 비노출)
</footer>

<script>
  const TOTAL = 40;
  const picks = new Set(JSON.parse(localStorage.getItem('ac_logo_picks')||'[]'));
  let favOnly = false;
  let lbIndex = 1;

  const grid = document.getElementById('grid');
  const countEl = document.getElementById('count');
  const summary = document.getElementById('summary');
  const summaryNums = document.getElementById('summaryNums');

  // build cards
  for(let i=1;i<=TOTAL;i++){
    const n = String(i).padStart(2,'0');
    const card = document.createElement('article');
    card.className='card';
    card.dataset.n=i;
    card.innerHTML = `
      <span class="num">${i}</span>
      <button class="fav" title="담기/빼기" aria-label="담기">&#9829;</button>
      <div class="thumb"><img src="/static/logos/logo-${n}.png" alt="로고 시안 ${i}번" loading="lazy"></div>
      <div class="cap"><span class="no">No. ${i}</span><a href="#" class="zoom">크게 보기</a></div>`;
    grid.appendChild(card);

    if(picks.has(i)) card.classList.add('picked');

    const toggle = ()=>{ 
      if(picks.has(i)){picks.delete(i);card.classList.remove('picked');}
      else{picks.add(i);card.classList.add('picked');}
      save();
    };
    card.querySelector('.fav').addEventListener('click',e=>{e.stopPropagation();toggle();});
    card.querySelector('.thumb').addEventListener('click',()=>openLB(i));
    card.querySelector('.zoom').addEventListener('click',e=>{e.preventDefault();openLB(i);});
  }

  function save(){
    localStorage.setItem('ac_logo_picks',JSON.stringify([...picks]));
    render();
  }
  function render(){
    const arr=[...picks].sort((a,b)=>a-b);
    countEl.textContent=arr.length;
    if(arr.length){
      summary.classList.add('show');
      summaryNums.textContent = arr.map(n=>'#'+n).join(', ');
    }else{
      summary.classList.remove('show');
      summaryNums.textContent='—';
      if(favOnly){favOnly=false;applyFav();}
    }
  }
  render();

  // background toggle
  document.querySelectorAll('[data-bg]').forEach(b=>{
    b.addEventListener('click',()=>{
      document.body.className=b.dataset.bg;
      document.querySelectorAll('[data-bg]').forEach(x=>x.classList.remove('active'));
      b.classList.add('active');
    });
  });
  document.querySelector('[data-bg="bg-ivory"]').classList.add('active');

  // fav-only filter
  const showFavBtn=document.getElementById('showFav');
  showFavBtn.addEventListener('click',()=>{favOnly=!favOnly;applyFav();});
  function applyFav(){
    showFavBtn.classList.toggle('active',favOnly);
    showFavBtn.textContent=favOnly?'전체 보기':'담은 것만 보기';
    document.querySelectorAll('.card').forEach(c=>{
      const n=+c.dataset.n;
      c.style.display=(favOnly && !picks.has(n))?'none':'';
    });
  }

  // copy / clear
  document.getElementById('copyBtn').addEventListener('click',()=>{
    const arr=[...picks].sort((a,b)=>a-b);
    const txt='올케어치과 로고 선택: '+arr.map(n=>n+'번').join(', ');
    navigator.clipboard.writeText(txt).then(()=>{
      const b=document.getElementById('copyBtn');const o=b.textContent;
      b.textContent='복사됨!';setTimeout(()=>b.textContent=o,1400);
    });
  });
  document.getElementById('clearBtn').addEventListener('click',()=>{
    picks.clear();
    document.querySelectorAll('.card').forEach(c=>c.classList.remove('picked'));
    save();
  });

  // lightbox
  const lb=document.getElementById('lb');
  const lbImg=document.getElementById('lbImg');
  const lbNum=document.getElementById('lbNum');
  function openLB(i){
    lbIndex=i;
    lbImg.src=`/static/logos/logo-${String(i).padStart(2,'0')}.png`;
    lbNum.textContent='No. '+i;
    lb.classList.add('show');
  }
  function closeLB(){lb.classList.remove('show')}
  function step(d){lbIndex=((lbIndex-1+d+TOTAL)%TOTAL)+1;openLB(lbIndex);}
  document.getElementById('lbClose').addEventListener('click',closeLB);
  document.getElementById('lbPrev').addEventListener('click',()=>step(-1));
  document.getElementById('lbNext').addEventListener('click',()=>step(1));
  lb.addEventListener('click',e=>{if(e.target===lb)closeLB();});
  document.addEventListener('keydown',e=>{
    if(!lb.classList.contains('show'))return;
    if(e.key==='Escape')closeLB();
    if(e.key==='ArrowLeft')step(-1);
    if(e.key==='ArrowRight')step(1);
  });
</script>
</body>
</html>
